# ============================================================
#  XP ROULETTE - konfigurasi utama
# ============================================================

# ---------- SIASAT WAKTU ----------
# Waktu HANYA berjalan saat pemain online.
cycle:
  # Panjang 1 siklus (menit). Default: tiap 30 menit roda takdir berputar.
  interval-minutes: 30
  # Lama efek aktif di awal siklus (menit). Sisanya (30 - 15 = 15 menit) = cooldown.
  # Jika pemain MATI saat efek aktif, efek hangus dan sisa siklus jadi cooldown.
  active-minutes: 15
  # Pemain baru: roda pertama berputar setelah sekian detik sejak pertama kali join.
  first-join-delay-seconds: 60

