# =====================================================================
#  SENZY - config.yml
#  Semua angka gameplay ada di sini. Teks pemain ada di messages.yml.
#  Setelah mengubah file ini, jalankan /senzy reload.
# =====================================================================

debug:
  enabled: false

data:
  # Seberapa sering data pemain disimpan otomatis (selain otomatis tersimpan setiap perubahan penting).
  autosave-interval: "5m"

# =====================================================================
#  XPR - BOOST PROGRESSION
# =====================================================================
xpr:
  enabled: true
  # Level maksimum per tier. Level TIDAK PERNAH melebihi angka ini.
  max-level: 30

  roll:
    # Biaya XP level per putaran roulette.
    cost-levels: 3
    # Jeda antar putaran per pemain (anti-spam).
    cooldown: "5s"
    # Suara saat mendapat hasil roll / naik tier.
    sound: "entity.experience_orb.pickup"

  duration:
    # duration = base + (level - 1) * per-level
    base: "10m"
    per-level: "1m"

  cooldown:
    # cooldown = base - floor((level - 1) / every-levels) * amount, dijepit ke minimum
    base: "30m"
    minimum: "5m"
    reduction:
      every-levels: 2
      amount: "1m"

  tiers:
    # Jika true, Level 30 langsung membuka tier berikutnya otomatis.
    # Jika false, pemain harus konfirmasi lewat GUI / /senzy xpr upgrade.
    auto-advance: false
    confirm-gui: true

  side-effect:
    # TIER = stage side-effect mengikuti nomor tier. PROGRESSION = mengikuti progres keseluruhan.
    stage-source: "TIER"

  active:
    # Interval (tick) penyegaran efek boost yang sedang aktif.
    refresh-interval: 20
    end-on-death: true
    effect-particles: false

  gui:
    click-to-activate: true

  # ---------------------------------------------------------------
  # Definisi boost. Tambah boost baru cukup salin salah satu blok di bawah.
  # ---------------------------------------------------------------
  # (dipindah ke bawah sebagai node top-level 'boosts' dan 'side-effects', lihat di bawah)

side-effects:
  nausea-mining:
    type: "nausea"
    pulse-duration: "4s"
    stages:
      1: { amplifier: 3, interval: "20s", duration: "4s" }
      2: { amplifier: 3, interval: "30s", duration: "4s" }
      3: { amplifier: 2, interval: "40s", duration: "4s" }
      4: { amplifier: 2, interval: "50s", duration: "3s" }
      5: { amplifier: 1, interval: "60s", duration: "3s" }
  slowness-speed:
    type: "slowness"
    pulse-duration: "3s"
    stages:
      1: { amplifier: 2, interval: "25s", duration: "3s" }
      2: { amplifier: 2, interval: "35s", duration: "3s" }
      3: { amplifier: 1, interval: "45s", duration: "3s" }
      4: { amplifier: 1, interval: "55s", duration: "2s" }
      5: { amplifier: 1, interval: "70s", duration: "2s" }
  weakness-strength:
    type: "weakness"
    pulse-duration: "3s"
    stages:
      1: { amplifier: 2, interval: "20s", duration: "3s" }
      2: { amplifier: 2, interval: "30s", duration: "3s" }
      3: { amplifier: 1, interval: "40s", duration: "3s" }
      4: { amplifier: 1, interval: "50s", duration: "2s" }
      5: { amplifier: 1, interval: "65s", duration: "2s" }

boosts:
  mining:
    display-name: "<gold>Mining"
    icon: "DIAMOND_PICKAXE"
    effect: "haste"
    weight: 30
    side-effect: "nausea-mining"
    tiers:
      1: { base-duration: "10m", effect-amplifier: 0 }
      2: { base-duration: "20m", effect-amplifier: 1 }
      3: { base-duration: "30m", effect-amplifier: 2 }
  speed:
    display-name: "<aqua>Speed"
    icon: "SUGAR"
    effect: "speed"
    weight: 30
    side-effect: "slowness-speed"
    tiers:
      1: { base-duration: "10m", effect-amplifier: 0 }
      2: { base-duration: "20m", effect-amplifier: 1 }
      3: { base-duration: "30m", effect-amplifier: 2 }
  strength:
    display-name: "<red>Strength"
    icon: "IRON_SWORD"
    effect: "strength"
    weight: 20
    side-effect: "weakness-strength"
    tiers:
      1: { base-duration: "8m", effect-amplifier: 0 }
      2: { base-duration: "16m", effect-amplifier: 1 }
      3: { base-duration: "24m", effect-amplifier: 2 }
  vitality:
    display-name: "<light_purple>Vitality"
    icon: "GOLDEN_APPLE"
    effect: "regeneration"
    weight: 20
    tiers:
      1: { base-duration: "6m", effect-amplifier: 0 }
      2: { base-duration: "12m", effect-amplifier: 1 }

# =====================================================================
#  LOOTBOX - EVENT SYSTEM
# =====================================================================
lootbox:
  enabled: true
  # RNG #1: jumlah LootBox per session, dipilih acak di antara min-boxes..max-boxes tiap kali event dimulai.
  min-boxes: 3
  max-boxes: 8
  session-duration: "1h"
  # Session berakhir otomatis begitu semua LootBox terbuka (selain karena waktu habis).
  end-when-all-opened: true
  # Tampilkan koordinat pasti di broadcast/locate. Default false (hanya jarak & arah).
  reveal-coordinates: false
  # Jarak minimum antar LootBox dalam satu session (RNG #2 - lokasi - tetap memakai ini).
  minimum-distance-between-boxes: 75

  auto-start:
    enabled: true
    # Event LootBox muncul sendiri secara acak - jeda antar event dipilih ulang tiap kali
    # di antara min-interval..max-interval (BUKAN interval tetap).
    min-interval: "15m"
    max-interval: "2h"
    min-players: 1

  # Bobot rarity dasar (RNG #3, dipakai sebelum luck menyesuaikan - lihat 'luck' di bawah).
  # Harus berjumlah 100; jika tidak, tetap dipakai sebagai bobot relatif.
  rarity:
    common: 50.0
    rare: 24.0
    epic: 25.0
    legendary: 1.0

  # ------------------------------------------------------------- mystery luck (pity system)
  # Makin banyak LootBox dibuka BERTURUT-TURUT tanpa mendapat hadiah utama (reset-on), makin
  # besar peluang rarity tinggi - termasuk peluang Legendary Template. Tetap RNG (tidak pernah
  # 100%), dan streak-nya RESET begitu hadiah utama didapat, supaya tidak keterusan OP.
  luck:
    enabled: true
    # Rarity yang dianggap "hadiah utama" - begitu dapat ini, streak kembali ke 0.
    reset-on: "legendary"
    # Jumlah bukaan tanpa hadiah utama sampai luck mencapai plafon maksimum (bukan guarantee).
    max-streak: 40
    # Perkalian bobot tambahan per rarity saat luck di plafon (0 = tidak pernah dinaikkan).
    boost-multiplier:
      rare: 1.0
      epic: 3.0
      legendary: 8.0
    # Seberapa besar bobot COMMON diturunkan saat luck di plafon (0-1).
    common-reduction-factor: 0.6
    # Plafon peluang Legendary Template saat luck penuh (tetap RNG, tidak pernah pasti).
    max-template-chance: 0.05

  announcements:
    common: false
    rare: false
    epic: true
    legendary: true

  # Tampilan LootBox SEBELUM dibuka - sama untuk semua rarity (mystery box, tidak membocorkan isi).
  # Rarity sebenarnya baru terlihat lewat pesan & partikel saat LootBox dibuka.
  mystery:
    material: "ENDER_CHEST"
    beacon-color: "LIGHT_GRAY"

  # --------------------------------------------------------------- area spawn
  spawn-area:
    world: "world"
    # Bentuk persegi 1000x1000 di sekitar (center-x, center-z) - RNG #2 (lokasi) memilih titik
    # acak di dalam area ini. Kalau ingin lingkaran/titik tunggal, ganti ke 'mode', 'center', 'radius'
    # (lihat komentar di LootBoxLocationManager) - dua gaya ini bisa dipakai bergantian.
    center-x: 0
    center-z: 0
    size-x: 1000
    size-z: 1000
    center: { y: 64 }

  # Hanya dipakai pada mode POINT. 'radius' = sebaran lokal di sekitar anchor (BUKAN offset Y).
  # 'y-range' = toleransi ketinggian tanah dibanding Y anchor (terpisah dari radius).
  adjust:
    radius: 10
    y-offset: 0
    y-range: 16

  spawn:
    # Percobaan acak maksimum per LootBox sebelum pindah ke tahap fallback berikutnya.
    max-attempts: 50
    # Ronde tambahan pencarian jika LootBox yang ditemukan masih kurang dari target.
    extra-rounds: 1
    # Minimal LootBox yang harus valid agar session tetap dimulai.
    minimum-successful-spawns: 3
    allowed-environments: ["NORMAL"]
    min-y: 40
    max-y: 300
    void-margin: 8
    border-margin: 16
    # Batas jumlah chunk yang boleh dimuat selama satu pencarian (mencegah beban server).
    max-chunk-loads: 150
    generate-chunks: true
    headroom: 2
    minimum-distance-between: 75
    point-minimum-distance: 4
    unsafe-blocks: ["MAGMA_BLOCK", "CACTUS", "FIRE", "SOUL_FIRE", "TNT"]
    forbidden-zones: []
    # Contoh forbidden-zones:
    # - { world: "world", min-x: -50, max-x: 50, min-z: -50, max-z: 50 }

  fallback:
    enabled: true
    nearest-radius: 200
    nearest-step: 16
    nearest-attempts: 30
    alternative-attempts: 25
    # Jarak minimum antar-box dilonggarkan sebesar faktor ini HANYA di tahap alternatif
    # (aturan kritis - dunia/border/forbidden-zone/liquid/void/tabrakan - tidak pernah dilonggarkan).
    relax-distance-factor: 0.5

  beacon:
    enabled: true
    base-material: "IRON_BLOCK"
    require-beam: false
    colors:
      common: "WHITE"
      rare: "BLUE"
      epic: "PURPLE"
      legendary: "YELLOW"
    beam:
      enabled: true
    height-clearance:
      check: true
    particles:
      enabled: true
      interval: 10
      view-distance: 64
      ring-points: 10
      type: "END_ROD"

  hologram:
    enabled: true
    height: 1.4

  loot-rolls:
    common: { min: 1, max: 2 }
    rare: { min: 2, max: 3 }
    epic: { min: 2, max: 4 }
    legendary: { min: 3, max: 5 }

  bossbar:
    enabled: true
    color: "YELLOW"
    overlay: "PROGRESS"

  effects:
    start:
      sound: "entity.ender_dragon.growl"
      volume: 1.0
      pitch: 1.0
    open:
      sound: "entity.player.levelup"
      volume: 1.0
      pitch: 1.2
      particle: "totem_of_undying"
      count: 25
    legendary:
      sound: "ui.toast.challenge_complete"
      volume: 1.0
      pitch: 1.0
      particle: "totem_of_undying"
      count: 40

# =====================================================================
#  GACHA ENCHANTMENT SYSTEM
# =====================================================================

# EXP Bottle WAJIB ada di setiap LootBox, jumlahnya random 10-30, ditambahkan
# SETELAH reward utama selesai (bukan bagian dari RNG rarity).
guaranteed-reward:
  experience-bottle:
    enabled: true
    min: 10
    max: 30

# RARE: peluang tambahan mendapat SATU tool sederhana (Iron/Gold, 1-2 enchant, level rendah)
# di luar daftar material 'loot.rare' di bawah.
rare:
  tool:
    chance: 0.35
    min-enchants: 1
    max-enchants: 2
    max-enchantment-level: 3

# EPIC: selalu SATU tool/armor IRON dengan 2-5 enchant acak, level 1-5 (dua RNG terpisah:
# jumlah enchant dan level tiap enchant, supaya banyak enchant tidak otomatis berarti level tinggi).
epic:
  tool:
    min-enchants: 2
    max-enchants: 5
    max-enchantment-level: 5
    maximum-material: IRON

# LEGENDARY: selalu SATU tool/armor DIAMOND dengan 2-7 enchant acak, level 1-10.
# TIDAK PERNAH Netherite. Template = bonus terpisah, 1/1000, tanpa pity/counter.
legendary:
  tool:
    min-enchants: 2
    max-enchants: 7
    max-enchantment-level: 10
    maximum-material: DIAMOND
  template:
    enabled: true
    chance: 0.1
    denominator: 1000
    material: SMITHING_TEMPLATE

enchantment:
  # true = kombinasi enchant yang biasanya konflik (mis. Fortune + Silk Touch) tetap boleh muncul.
  # false = ikuti aturan konflik vanilla saat memilih pool enchant.
  allow-incompatible: true

# =====================================================================
#  LOOT TABLE - material dasar per rarity (weighted). Tool/armor ber-enchant
#  untuk Epic & Legendary DIHASILKAN LEWAT GACHA DI ATAS, bukan dari sini.
# =====================================================================
loot:
  common:
    - { item: "COAL", min: 10, max: 40, weight: 20 }
    - { item: "IRON_NUGGET", min: 10, max: 30, weight: 15 }
    - { item: "IRON_INGOT", min: 4, max: 16, weight: 15 }
    - { item: "COPPER_INGOT", min: 8, max: 32, weight: 15 }
    - { item: "GOLD_NUGGET", min: 10, max: 30, weight: 10 }
    - { item: "REDSTONE", min: 10, max: 40, weight: 10 }
    - { item: "LAPIS_LAZULI", min: 8, max: 24, weight: 8 }
    - { item: "QUARTZ", min: 4, max: 16, weight: 7 }
    - { item: "BREAD", min: 4, max: 10, weight: 8 }
    - { item: "COOKED_BEEF", min: 4, max: 10, weight: 8 }
    - { item: "ARROW", min: 8, max: 16, weight: 8 }
  rare:
    - { item: "DIAMOND", min: 1, max: 3, weight: 25 }
    - { item: "EMERALD", min: 4, max: 10, weight: 20 }
    - { item: "GOLD_INGOT", min: 4, max: 10, weight: 20 }
    - { item: "ENCHANTED_BOOK", min: 1, max: 1, weight: 10 }
    - { item: "GOLDEN_APPLE", min: 1, max: 2, weight: 10 }
    - { item: "ENDER_PEARL", min: 1, max: 3, weight: 15 }
  # Dipakai HANYA sebagai cadangan kalau gacha enchant gagal total (mis. semua enchant tidak dikenal
  # di versi server ini) - dalam kondisi normal tidak pernah terpakai.
  epic:
    - { item: "DIAMOND", min: 2, max: 4, weight: 60 }
    - { item: "EMERALD", min: 3, max: 6, weight: 40 }
  legendary:
    - { item: "EMERALD", min: 6, max: 12, weight: 40 }
    - { item: "GOLDEN_APPLE", min: 2, max: 3, weight: 30 }
    - { item: "ENCHANTED_BOOK", min: 1, max: 2, weight: 30 }
