# =====================================================================
#  SENZY - messages.yml
#  Semua teks yang dilihat pemain. Format: MiniMessage (<green>, <bold>, dst).
#  Placeholder ditulis sebagai tag, contoh: <boost>, <time>, <player>.
#  <prefix> selalu tersedia otomatis.
# =====================================================================

prefix: "<gradient:#7c3aed:#22d3ee><bold>Senzy</bold></gradient> <dark_gray>»</dark_gray> "

generic:
  no-permission: "<prefix><red>Kamu tidak punya izin untuk itu."
  players-only: "<prefix><red>Perintah ini hanya untuk pemain."
  usage: "<prefix><yellow>Penggunaan: <white><usage>"
  player-not-found: "<prefix><red>Pemain '<player>' tidak ditemukan / sedang offline."
  invalid-number: "<prefix><red>'<value>' bukan angka yang valid."
  reloaded: "<prefix><green>Konfigurasi, pesan, dan semua modul Senzy berhasil dimuat ulang."

direction:
  north: "Utara"
  north-east: "Timur Laut"
  east: "Timur"
  south-east: "Tenggara"
  south: "Selatan"
  south-west: "Barat Daya"
  west: "Barat"
  north-west: "Barat Laut"

rarity:
  common: "<gray>Common"
  rare: "<blue>Rare"
  epic: "<light_purple>Epic"
  legendary: "<gold><bold>Legendary</bold>"

help:
  main:
    - "<prefix><yellow><bold>Daftar Perintah</bold>"
    - "<gray> <white>/senzy xpr <gray>- Sistem Boost Progression (XPR)"
    - "<gray> <white>/senzy lootbox <gray>- Event LootBox"
    - "<gray> <white>/senzy reload <gray>- Muat ulang config & pesan"
  xpr:
    - "<prefix><yellow><bold>Perintah XPR</bold>"
    - "<gray> <white>/senzy xpr status <gray>- Boost aktif & ringkasan"
    - "<gray> <white>/senzy xpr boosts <gray>- Daftar semua boost & progresmu"
    - "<gray> <white>/senzy xpr info <boost> <gray>- Detail satu boost"
    - "<gray> <white>/senzy xpr upgrade <boost> <gray>- Buka tier berikutnya (jika sudah siap)"
    - "<gray> <white>/senzy xpr roll <gray>- Putar roulette boost"
    - "<gray> <white>/senzy xpr activate <boost> <gray>- Aktifkan boost yang kamu punya"
    - "<gray> <white>/senzy xpr gui <gray>- Buka menu XPR"
  lootbox:
    - "<prefix><yellow><bold>Perintah LootBox</bold>"
    - "<gray> <white>/senzy lootbox status <gray>- Status event saat ini"
    - "<gray> <white>/senzy lootbox locate <gray>- Cari LootBox terdekat"
    - "<gray> <white>/senzy lootbox gui <gray>- Buka menu LootBox"

# =====================================================================
#  XPR
# =====================================================================
xpr:
  disabled: "<prefix><red>Sistem XPR sedang dimatikan."
  unknown-boost: "<prefix><red>Boost '<boost>' tidak dikenal."

  status:
    header: "<prefix><white>Boost dimiliki: <yellow><owned></yellow>/<total>"
    active: "<prefix><green>Sedang aktif: <boost> <gray>(sisa <time>)"
    no-active: "<prefix><gray>Tidak ada boost yang sedang aktif."

  boosts:
    header: "<prefix><yellow><bold>Daftar Boost</bold>"
    line: "<gray> <boost> <white>- Tier <tier> Level <level>/<max>"
    locked-line: "<gray> <boost> <dark_gray>- belum dimiliki"

  info:
    locked: "<prefix><gray>Kamu belum memiliki <boost><gray>. Putar roulette untuk mendapatkannya."
    line: "<prefix><boost> <gray>Tier <tier> Level <level>/<max><newline><gray>  Durasi: <white><duration> <gray> Cooldown: <white><cooldown><newline><gray>  Efek samping: <white><side_effect>"

  roll:
    no-boosts: "<prefix><red>Belum ada boost yang dikonfigurasi."
    cooldown: "<prefix><yellow>Tunggu <time> lagi sebelum roll berikutnya."
    all-maxed: "<prefix><gold>Semua boost sudah mencapai tier & level maksimum!"
    not-enough-xp: "<prefix><red>Butuh <cost> level XP (kamu punya <levels>)."
    sound: "entity.experience_orb.pickup"
    unlocked: "<prefix><green>Kamu mendapatkan boost baru: <bold><boost></bold> <gray>(Tier <tier> Level <level>/<max>)"
    level-up: "<prefix><green><boost> <white>naik ke Level <level>/<max> <gray>(Tier <tier>)"
    tier-advanced: "<prefix><gold><bold>Tier Naik!</bold> <white><boost> <gray>Tier <old_tier> ➜ Tier <tier> <gray>(Level <level>/<max>)"
    tier-ready: "<prefix><gold><boost> <white>sudah mencapai Level maksimum! <yellow>Buka menu konfirmasi untuk lanjut ke Tier <next>."
    mastered-ready: "<prefix><aqua><boost> <white>MASTERED di Tier <tier><gray>! Tier <next> menunggu untuk dibuka."
    mastered-final: "<prefix><aqua><bold><boost> STABLE</bold> <gray>- sudah mencapai tier tertinggi."

  activate:
    not-owned: "<prefix><red>Kamu belum memiliki boost <boost>."
    already-active: "<prefix><yellow>Boost <boost> masih aktif <gray>(sisa <time>)."
    on-cooldown: "<prefix><yellow><boost> masih cooldown <gray>(sisa <time>)."
    ok: "<prefix><green><boost> diaktifkan! <gray>Tier <tier> Level <level> <gray>- durasi <white><duration>"
    side-effect: "<prefix><gray>Efek samping: <white><side_effect>"

  upgrade:
    not-owned: "<prefix><red>Kamu belum memiliki boost <boost>."
    max-tier: "<prefix><gold><boost> sudah di tier tertinggi dan level maksimum."
    not-ready: "<prefix><yellow><boost> belum siap naik tier <gray>(Level <level>/<max>)."
    ok: "<prefix><gold><bold>Tier Terbuka!</bold> <white><boost> <gray>Tier <old_tier> ➜ Tier <tier> <gray>(Level <level>/<max>)"

  ended:
    death: "<prefix><red><boost> berakhir karena kamu tewas. <gray>Cooldown: <white><cooldown>"
    expired: "<prefix><gray><boost> telah berakhir. <gray>Cooldown: <white><cooldown>"

  welcome-back-active: "<prefix><green>Boost <boost> masih aktif <gray>(sisa <time>)."

  admin:
    grant-ok: "<prefix><green>Memberi hasil roll <boost> ke <player>."
    reset-ok: "<prefix><green>Data XPR milik <player> telah direset."

# =====================================================================
#  LOOTBOX
# =====================================================================
lootbox:
  disabled: "<prefix><red>Event LootBox sedang dimatikan."

  hologram:
    lines:
      - "<gold><bold>[ LOOTBOX ]</bold>"
      - "<rarity>"

  status:
    active-line: "<prefix><green>Event aktif <gray>- <opened>/<total> terbuka <gray>- sisa <white><time>"
    inactive-line: "<prefix><gray>Tidak ada event LootBox yang berjalan."

  locate:
    inactive: "<prefix><gray>Tidak ada event LootBox yang berjalan."
    none: "<prefix><gray>Tidak ada LootBox aktif yang tersisa."
    found: "<prefix><rarity> <white>LootBox <gray>- <white><distance> blok <gray>ke arah <white><direction>"
    found-coords: "<prefix><rarity> <white>LootBox <gray>- <white><distance> blok <gray>ke arah <white><direction> <gray>(<x>, <y>, <z>)"

  open:
    inactive: "<prefix><red>LootBox ini sudah tidak berlaku."
    already: "<prefix><red>LootBox ini sudah dibuka."
    no-permission: "<prefix><red>Kamu tidak punya izin membuka LootBox."
    success: "<prefix><rarity> <white>LootBox terbuka!"
    rewards: "<prefix><gray>Kamu mendapatkan: <white><items>"
    nothing: "tidak ada apa-apa"

  announce:
    common: "<prefix><gray><player> membuka LootBox <rarity><gray>."
    rare: "<prefix><blue><player> membuka LootBox <rarity><blue>!"
    epic: "<prefix><light_purple><bold><player></bold> membuka LootBox <rarity><light_purple>!"
    legendary: "<prefix><gold><bold><player> membuka LootBox <rarity></bold><gold>!!! Selamat!"

  broadcast:
    start: "<prefix><gold><bold>Event LootBox dimulai!</bold> <white><count> LootBox tersebar di peta <gray>- selama <white><duration>"
    hint: "<prefix><yellow>Gunakan <white>/senzy lootbox locate <yellow>untuk mencari LootBox terdekat!"
    coords: "<prefix><rarity> <white>LootBox <gray>muncul di <white><world> (<x>, <y>, <z>)"

  ended:
    timeout: "<prefix><gray>Event LootBox berakhir <gray>- <white><opened>/<total> <gray>terbuka."
    all-opened: "<prefix><gold>Semua LootBox telah dibuka! Event selesai."
    stopped: "<prefix><yellow>Event LootBox dihentikan oleh admin <gray>- <white><opened>/<total> <gray>terbuka."
    reset: "<prefix><yellow>Event LootBox direset."

  bossbar:
    title: "<yellow><bold>LootBox</bold> <white><left>/<total> tersisa <gray>- <white><time>"

  admin:
    already-active: "<prefix><yellow>Event LootBox sudah berjalan."
    already-starting: "<prefix><yellow>Sedang mencari lokasi, tunggu sebentar."
    not-active: "<prefix><gray>Tidak ada event LootBox yang berjalan."
    world-missing: "<prefix><red>World '<world>' tidak ditemukan."
    searching: "<prefix><yellow>Mencari <amount> lokasi LootBox yang valid..."
    start-failed: "<prefix><red>Hanya <found> lokasi valid ditemukan (minimum <minimum>). Event dibatalkan, coba perlebar area."
    started: "<prefix><green>Event LootBox dimulai dengan <count>/<amount> LootBox."
    stopped: "<prefix><green>Event LootBox dihentikan."
    reset: "<prefix><green>Event LootBox direset."
    anchor-set: "<prefix><green>Titik acuan diatur ke <world> (<x>, <y>, <z>)."
    radius-set: "<prefix><green>Radius diatur ke <radius> blok."
    area-reset: "<prefix><green>Area LootBox dikembalikan ke pengaturan config.yml."
    area-info: "<prefix><white>World: <world> <gray>Mode: <mode> <gray>Center: (<x>, <y>, <z>) <gray>Radius: <radius>"

# =====================================================================
#  GUI - XPR
# =====================================================================
gui:
  xpr:
    title: "<dark_purple><bold>Senzy XPR</bold>"
    close:
      name: "<red>Tutup"
    info:
      name: "<white><bold>Informasi</bold>"
      lore:
        - "<gray>Boost dimiliki: <yellow><owned></yellow>/<total>"
        - " "
        - "<gray>Klik boost untuk mengaktifkan."
        - "<gray>Boost di Level maksimum bisa"
        - "<gray>membuka tier berikutnya."
    roll:
      name: "<green><bold>Putar Roulette</bold>"
      lore:
        - "<gray>Biaya: <yellow><cost> level XP"
        - "<gray>Level kamu sekarang: <white><levels>"
        - " "
        - "<yellow>Klik untuk memutar!"
    locked:
      name: "<dark_gray>??? <gray>(Terkunci)"
      lore:
        - "<dark_gray>Belum kamu miliki."
        - "<dark_gray>Dapatkan lewat Roll."
    boost:
      name: "<boost> <gray>[Tier <tier>]"
      lore:
        - "<gray>Level <level>/<max> <mastered>"
        - "<white><progress>"
        - " "
        - "<gray>Durasi: <white><duration>"
        - "<gray>Cooldown: <white><cooldown>"
        - "<gray>Efek samping: <white><side_effect>"
        - " "
        - "<status>"
        - "<next>"
    status:
      active: "<green>● Aktif <gray>(sisa <time>)"
      cooldown: "<red>● Cooldown <gray>(sisa <time>)"
      ready: "<yellow>● Siap dipakai - klik untuk aktifkan"
    next:
      tier: "<gray><left> level lagi ke Tier <next>"
      pending: "<gold>Siap membuka Tier <next>! Klik untuk konfirmasi."
      max-level: "<gray><left> level lagi ke Level maksimum"
      max: "<aqua>Tier tertinggi tercapai!"
    mastered: "<gold>★"
    bar:
      full: "<green>■"
      empty: "<gray>■"
    none: "Tidak ada"

  confirm:
    title: "<gold><bold>Buka Tier Berikutnya?</bold>"
    unlock:
      name: "<green><bold>BUKA TIER <next></bold>"
      lore:
        - "<gray><boost> akan naik dari"
        - "<gray>Tier <tier> ke Tier <next>"
        - "<gray>dan kembali ke Level 1."
    info:
      name: "<white><boost>"
      lore:
        - "<gray>Kamu telah MASTERED Tier <tier>"
        - "<gray>(Level <max>/<max>)."
    cancel:
      name: "<red><bold>NANTI SAJA</bold>"

  # ---------------------------------------------------------------
  #  GUI - LootBox
  # ---------------------------------------------------------------
  lootbox:
    title: "<dark_aqua><bold>Senzy LootBox</bold>"
    status:
      active: "<green>Aktif"
      inactive: "<gray>Tidak Aktif"
      name: "<white><bold>Status Event</bold>"
      lore:
        - "<gray>Status: <status>"
        - "<gray>Sisa waktu: <white><time>"
        - "<gray>Terbuka: <yellow><opened></yellow>/<total>"
        - "<gray>Tersisa: <white><left>"
    area:
      name: "<white><bold>Area Spawn</bold>"
      lore:
        - "<gray>World: <white><world>"
        - "<gray>Mode: <white><mode>"
        - "<gray>Center: <white>(<x>, <y>, <z>)"
        - "<gray>Radius: <white><radius>"
    rates:
      name: "<white><bold>Peluang Rarity</bold>"
      lore:
        - "<gray>Common: <white><common>%"
        - "<blue>Rare: <white><rare>%"
        - "<light_purple>Epic: <white><epic>%"
        - "<gold>Legendary: <white><legendary>%"
    rules:
      name: "<white><bold>Aturan</bold>"
      lore:
        - "<gray>- LootBox tidak bisa dibuka dua kali"
        - "<gray>- Jangan merusak beacon / penanda"
        - "<gray>- Gunakan /senzy lootbox locate"
        - "<gray>  untuk mencari LootBox terdekat"
    locations:
      name: "<yellow><bold>Kelola Lokasi</bold>"
      lore:
        - "<gray>Klik untuk membuka menu area spawn."
    start:
      name: "<green><bold>Mulai Event</bold>"
      lore:
        - "<gray>Mencari lokasi & memulai session baru."
    stop:
      name: "<red><bold>Hentikan Event</bold>"
      lore:
        - "<gray>Menghentikan session yang sedang berjalan."

  locations:
    title: "<dark_aqua><bold>Senzy LootBox - Lokasi</bold>"
    world:
      name: "<white><bold>World</bold>"
      lore:
        - "<gray><world>"
    center:
      name: "<white><bold>Center</bold>"
      lore:
        - "<gray>(<x>, <y>, <z>)"
    radius:
      name: "<white><bold>Radius</bold>"
      lore:
        - "<gray><radius> blok"
        - " "
        - "<yellow>Klik kiri: +10  <gray>|  <yellow>Klik kanan: -10"
    mode:
      name: "<white><bold>Mode</bold>"
      lore:
        - "<gray><mode>"
        - " "
        - "<yellow>Klik untuk beralih mode"
    active:
      name: "<white><bold>LootBox Aktif</bold>"
      lore:
        - "<gray><count>/<total> belum dibuka"
    set:
      name: "<green><bold>Set Anchor di Sini</bold>"
      lore:
        - "<gray>Memakai posisi kamu sekarang"
        - "<gray>sebagai titik pusat (mode POINT)."
    reset:
      name: "<red><bold>Reset ke config.yml</bold>"
      lore:
        - "<gray>Menghapus semua penyesuaian admin."
    back:
      name: "<gray>« Kembali"
