# ============================================================
#  XP ROULETTE - pesan (format MiniMessage)
#  Placeholder memakai kurung kurawal, contoh: {player}, {time}, {multiplier}
#  Hindari tanda < atau > biasa di teks (gunakan [ ] sebagai gantinya).
# ============================================================

prefix: "<gradient:#ffb300:#ff5e00><bold>XP Roulette</bold></gradient> <dark_gray>»</dark_gray>"

# ---------- SAAT JOIN ----------
join:
  first:
    - ""
    - "<gradient:#ffd700:#ff8c00><bold>━━━ SELAMAT DATANG DI XP ROULETTE ━━━</bold></gradient>"
    - "<gray>Tiap <yellow>{interval}</yellow>, roda takdir memberimu <gold>efek acak</gold> selama <green>{active}</green>."
    - "<gray>Makin tinggi <green>level XP</green>-mu, makin dahsyat efeknya... <red>tapi risikonya juga!</red>"
    - "<gray>Ketik <yellow>/xpr aturan</yellow> untuk membaca aturan main lengkap."
    - ""
  back-active: "{prefix} <green>Selamat datang kembali! Roulette-mu masih aktif <yellow>{time}</yellow> lagi."
  back-cooldown: "{prefix} <gray>Roulette berikutnya aktif dalam <yellow>{time}</yellow>. Kumpulkan XP dulu!"
  back-dead: "{prefix} <red>Roulette-mu hangus karena mati.</red> <gray>Aktif lagi dalam <yellow>{time}</yellow>."

# ---------- SAAT RODA BERPUTAR ----------
activation:
  title: "<gradient:#ffd700:#ff8c00><bold>⚡ ROULETTE XP AKTIF! ⚡</bold></gradient>"
  subtitle: "<gray>Level <green>{level}</green> <dark_gray>•</dark_gray> <yellow>{tier}</yellow> <dark_gray>•</dark_gray> Pengali <gold>x{multiplier}</gold>"
  header: "<gradient:#ffd700:#ff8c00><bold>━━━━━━ RODA TAKDIR BERPUTAR ━━━━━━</bold></gradient>"
  intros:
    - "<yellow>Roda takdir berputar... tik... tik... tik... <gold><bold>BERHENTI!</bold>"
    - "<aqua>Bintang-bintang berpihak padamu... atau mungkin tidak."
    - "<light_purple>Sihir kuno bergemuruh di dalam levelmu!"
    - "<gold>Dadu dilempar! Nasibmu ditentukan oleh XP-mu."
    - "<green>Energi XP-mu meledak menjadi kekuatan!"
    - "<yellow>Para dewa tambang menatapmu dan mengangguk pelan..."
  info: "<gray>Level XP: <green>{level}</green> <dark_gray>|</dark_gray> Rank: <yellow>{tier}</yellow> <dark_gray>|</dark_gray> Pengali: <gold>x{multiplier}</gold>"
  good-line: " <green>✔ <white>{effect}</white> <dark_gray>—</dark_gray> <gray><italic>{flavor}</italic>"
  risk-line: " <red>✘ <white>{effect}</white> <dark_gray>—</dark_gray> <gray><italic>{flavor}</italic>"
  no-risk: "<green>★ Dewi Fortuna tersenyum — kali ini TANPA risiko!"
  risk-warnings:
    - "<red>Tapi ingat: setiap kekuatan ada harganya. Jangan sampai mati!"
    - "<red>Dunia memberi, roulette pun mengambil. Hati-hati!"
    - "<dark_red>Ada bayaran untuk semua kekuatan ini... bertahanlah!"
    - "<red>Mati = semua efek hangus. Mainkan dengan cerdas!"
  footer: "<gray>Berlangsung selama <yellow>{duration}</yellow>. <dark_gray>Mati = hangus sampai putaran berikutnya.</dark_gray>"

# ---------- PESAN ACAK SAAT EFEK AKTIF (action bar) ----------
flavor:
  good:
    - "<green>Kekuatan roulette mengalir deras di nadimu!"
    - "<gold>Kamu sedang di puncak kejayaan. Manfaatkan waktunya!"
    - "<aqua>Dunia terasa lebih kecil dari biasanya..."
    - "<yellow>Waktunya berburu, menambang, atau menaklukkan sesuatu!"
  risk:
    - "<red>Efek buruk masih menempel... bertahanlah!"
    - "<dark_red>Jangan sampai mati, bayarannya terlalu mahal!"
    - "<gold>Kekuatan besar, risiko besar. Tetap waspada!"
    - "<red>Ada yang menggerogotimu... tapi kamu pasti kuat!"

# ---------- KOMENTAR TIAP EFEK ----------
effect-flavor-default:
  good:
    - "Anugerah dari roda takdir"
    - "Keberuntungan berpihak padamu"
    - "Kekuatan baru mengalir"
  risk:
    - "Harga dari sebuah kekuatan"
    - "Roda takdir kadang kejam"
    - "Ujian dari roda takdir"

effect-flavor:
  speed: "Angin pun iri padamu"
  haste: "Tanganmu secepat kilat"
  strength: "Otot bajamu menggelegar"
  jump_boost: "Melompat setinggi awan"
  regeneration: "Lukamu menutup sendiri"
  resistance: "Kulitmu sekeras berlian"
  fire_resistance: "Lava? Cuma air hangat"
