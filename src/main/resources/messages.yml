  mining_fatigue: "Tanganmu lemas tak bertenaga"
  weakness: "Tenagamu terkuras habis"
  poison: "Racun menggerogoti dari dalam"
  wither: "Kematian mengintai perlahan"
  hunger: "Perutmu keroncongan tanpa henti"
  nausea: "Dunia berputar-putar"
  blindness: "Semuanya gelap gulita"
  darkness: "Kegelapan menelan sekelilingmu"
  glowing: "Semua orang bisa melihatmu"
  unluck: "Sial! Nasib buruk mengikutimu"
  bad_omen: "Pertanda buruk... awas desa!"
  weaving: "Jaring laba-laba menantimu saat ajal"
  oozing: "Slime menantimu saat ajal"
