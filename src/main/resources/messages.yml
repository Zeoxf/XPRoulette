  wind_charged: "Angin liar siap meledak"

# ---------- NAMA RANK (berdasarkan tier, tier terakhir dipakai untuk seterusnya) ----------
tier-names:
  - "Pemula"
  - "Petualang"
  - "Pejuang"
  - "Veteran"
  - "Elit"
  - "Legenda"
  - "Mitos"
  - "Dewa Tambang"

# ---------- EFEK BERAKHIR ----------
expire:
  title: "<gold><bold>Roulette Berakhir</bold>"
  subtitle: "<gray>Terima kasih atas kekuatannya!"
  chat: "{prefix} <yellow>Efek Roulette habis.</yellow> <gray>Roda berputar lagi dalam <yellow>{time}</yellow>. Kumpulkan XP!"

# ---------- MATI ----------
death:
  title: "<dark_red><bold>☠ ROULETTE HANGUS ☠</bold>"
  subtitle: "<gray>Kamu mati... efek tidak diberikan lagi"
  chat: "{prefix} <red>Kamu tewas saat Roulette aktif! Semua efek hangus.</red> <gray>Roda berputar lagi dalam <yellow>{time}</yellow>."
  quips:
    - "<gray>Roda takdir tertawa pelan di belakangmu..."
    - "<gray>Kekuatan besar butuh kepala yang dingin. Lain kali lebih hati-hati!"
    - "<gray>Setidaknya kamu mati dengan gaya."
    - "<gray>Level XP-mu adalah taruhanmu. Selamat mencoba lagi!"

# ---------- PENGUMUMAN SERVER ----------
broadcast:
  high: "{prefix} <gold>{player}</gold> <yellow>baru saja mendapat Roulette</yellow> <gradient:red:gold><bold>x{multiplier}</bold></gradient><yellow>! Semoga selamat...</yellow>"
  death: "{prefix} <dark_red>☠</dark_red> <gold>{player}</gold> <gray>tewas saat memegang Roulette</gray> <red>x{multiplier}</red><gray>. Rest in peace.</gray>"

# ---------- PERINGATAN & HITUNG MUNDUR ----------
warn-end: "{prefix} <yellow>⚠ Efek Roulette habis dalam <gold>{time}</gold>!"
warn-start: "{prefix} <aqua>Roda takdir berputar dalam <yellow>{time}</yellow>. Kumpulkan XP sekarang!"
countdown:
  title: "<gold><bold>{seconds}</bold>"
  subtitle: "<gray>Roda takdir akan berputar..."

# ---------- BOSSBAR ----------
bossbar:
  active: "<green>⚡ Roulette <gold>x{multiplier}</gold> <gray>•</gray> <white>{time}</white>"
  active-risk: "<red>⚡ Roulette <gold>x{multiplier}</gold> <gray>•</gray> <white>{time}</white> <dark_gray>(ada risiko!)</dark_gray>"
  cooldown: "<aqua>Roulette berikutnya <gray>•</gray> <white>{time}</white>"
  dead: "<dark_red>☠ Hangus <gray>•</gray> <white>{time}</white> <dark_gray>sampai putaran berikutnya</dark_gray>"

# ---------- /xpr status ----------
status:
  header: "<gradient:#ffd700:#ff8c00><bold>━━━ STATUS XP ROULETTE ━━━</bold></gradient>"
  level: "<gray>Level XP: <green>{level}</green> <dark_gray>•</dark_gray> Rank: <yellow>{tier}</yellow> <dark_gray>•</dark_gray> Pengali sekarang: <gold>x{multiplier}</gold>"
  active: "<green>● AKTIF</green> <gray>— sisa <yellow>{time}</yellow> (pengali <gold>x{multiplier}</gold>, dari level {level})"
  cooldown: "<yellow>● COOLDOWN</yellow> <gray>— aktif lagi dalam <yellow>{time}</yellow>"
  dead: "<red>● HANGUS (kamu mati)</red> <gray>— aktif lagi dalam <yellow>{time}</yellow>"
  good-line: "  <green>✔ {effect}"
  risk-line: "  <red>✘ {effect}"
  next: "<gray>Naik <green>{levels}</green> level lagi untuk pengali <gold>x{multiplier}</gold>!"

# ---------- /xpr preview ----------
preview:
  header: "<gradient:#ffd700:#ff8c00><bold>━━━ PRATINJAU PENGALI ━━━</bold></gradient>"
  line: "<gray>Level <green>{level}</green> → pengali <gold>x{multiplier}</gold> <dark_gray>•</dark_gray> efek positif <green>{good}</green> <dark_gray>•</dark_gray> peluang risiko <red>{chance}%</red>"

# ---------- ATURAN MAIN (/xpr aturan) ----------
rules:
  lines:
    - "<gradient:#ffd700:#ff8c00><bold>━━━━━━ ATURAN MAIN XP ROULETTE ━━━━━━</bold></gradient>"
    - "<yellow>1.</yellow> <gray>Tiap <white>{interval}</white>, roda takdir berputar dan memberimu efek <gold>acak</gold> selama <green>{active}</green>."
    - "<yellow>2.</yellow> <gray>Efek dipilih berdasarkan <green>level XP</green>-mu <white>saat roda berputar</white>."
    - "<yellow>3.</yellow> <gray>Level <white>0-{first_end}</white> = semua efek <white>x1</white>. Tiap naik <white>{per_tier} level</white>, kekuatan efek naik: <gold>{ladder}</gold>"
    - "<yellow>4.</yellow> <gray>Makin tinggi level, makin banyak efek positif... tapi <red>risiko</red> (Poison, Weakness, Wither, dll) juga makin sering dan kuat!"
    - "<yellow>5.</yellow> <gray>Jika kamu <red>MATI</red> saat efek aktif, efek <red>hangus</red> dan tidak diberikan lagi. Sisa siklus jadi <yellow>cooldown</yellow>."
    - "<yellow>6.</yellow> <gray>Setelah efek habis ada <yellow>{cooldown}</yellow> cooldown sebelum putaran berikutnya. Waktu hanya berjalan saat kamu <white>online</white>."
    - "<yellow>7.</yellow> <gray>Susu dan totem <red>tidak bisa</red> menghapus efek Roulette. Roda takdir tidak bisa dicurangi!"
    - "<gray>Perintah: <yellow>/xpr status</yellow> <dark_gray>•</dark_gray> <yellow>/xpr aturan</yellow> <dark_gray>•</dark_gray> <yellow>/xpr preview [level]</yellow>"

# ---------- PERINTAH ----------
cmd:
  usage: "{prefix} <gray>Gunakan: <yellow>/xpr [status|aturan|preview]</yellow>"
  usage-admin: "{prefix} <gray>Admin: <yellow>/xpr [reload|force|reset] [pemain]</yellow>"
  no-permission: "{prefix} <red>Kamu tidak punya izin untuk itu."
  players-only: "{prefix} <red>Perintah ini hanya untuk pemain."
  player-not-found: "{prefix} <red>Pemain tidak ditemukan / tidak online."
  reloaded: "{prefix} <green>Konfigurasi dan pesan berhasil dimuat ulang."
  forced: "{prefix} <green>Roda takdir dipaksa berputar untuk <gold>{player}</gold>."
  reset: "{prefix} <green>Data Roulette <gold>{player}</gold> direset."
  invalid-number: "{prefix} <red>Angka level tidak valid."
