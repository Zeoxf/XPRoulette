# ---------- NAMA RANK (berdasarkan tier, tier terakhir dipakai untuk seterusnya) ----------
tier-names:
  - "Pemula"
  - "Petualang"
  - "Pejuang"
  - "Veteran"
  - "Elit"
  - "Legenda"
  - "Mitos"
  - "Dewa Tambang"

# ---------- EFEK BERAKHIR ----------
expire:
  title: "<gold><bold>Roulette Berakhir</bold>"
  subtitle: "<gray>Terima kasih atas kekuatannya!"
  chat: "{prefix} <yellow>Efek Roulette habis.</yellow> <gray>Roda berputar lagi dalam <yellow>{time}</yellow>. Kumpulkan XP!"

# ---------- MATI ----------
death:
  title: "<dark_red><bold>☠ ROULETTE HANGUS ☠</bold>"
  subtitle: "<gray>Kamu mati... efek tidak diberikan lagi"
  chat: "{prefix} <red>Kamu tewas saat Roulette aktif! Semua efek hangus.</red> <gray>Roda berputar lagi dalam <yellow>{time}</yellow>."
  quips:
    - "<gray>Roda takdir tertawa pelan di belakangmu..."
    - "<gray>Kekuatan besar butuh kepala yang dingin. Lain kali lebih hati-hati!"
    - "<gray>Setidaknya kamu mati dengan gaya."
    - "<gray>Level XP-mu adalah taruhanmu. Selamat mencoba lagi!"

# ---------- PENGUMUMAN SERVER ----------
broadcast:
  high: "{prefix} <gold>{player}</gold> <yellow>baru saja mendapat Roulette</yellow> <gradient:red:gold><bold>x{multiplier}</bold></gradient><yellow>! Semoga selamat...</yellow>"
  death: "{prefix} <dark_red>☠</dark_red> <gold>{player}</gold> <gray>tewas saat memegang Roulette</gray> <red>x{multiplier}</red><gray>. Rest in peace.</gray>"

# ---------- PERINGATAN & HITUNG MUNDUR ----------
warn-end: "{prefix} <yellow>⚠ Efek Roulette habis dalam <gold>{time}</gold>!"
warn-start: "{prefix} <aqua>Roda takdir berputar dalam <yellow>{time}</yellow>. Kumpulkan XP sekarang!"
countdown:
  title: "<gold><bold>{seconds}</bold>"
  subtitle: "<gray>Roda takdir akan berputar..."

# ---------- BOSSBAR ----------
bossbar:
  active: "<green>⚡ Roulette <gold>x{multiplier}</gold> <gray>•</gray> <white>{time}</white>"
  active-risk: "<red>⚡ Roulette <gold>x{multiplier}</gold> <gray>•</gray> <white>{time}</white> <dark_gray>(ada risiko!)</dark_gray>"
  cooldown: "<aqua>Roulette berikutnya <gray>•</gray> <white>{time}</white>"
  dead: "<dark_red>☠ Hangus <gray>•</gray> <white>{time}</white> <dark_gray>sampai putaran berikutnya</dark_gray>"

# ---------- /xpr status ----------
status:
  header: "<gradient:#ffd700:#ff8c00><bold>━━━ STATUS XP ROULETTE ━━━</bold></gradient>"
  level: "<gray>Level XP: <green>{level}</green> <dark_gray>•</dark_gray> Rank: <yellow>{tier}</yellow> <dark_gray>•</dark_gray> Pengali sekarang: <gold>x{multiplier}</gold>"
  active: "<green>● AKTIF</green> <gray>— sisa <yellow>{time}</yellow> (pengali <gold>x{multiplier}</gold>, dari level {level})"
  cooldown: "<yellow>● COOLDOWN</yellow> <gray>— aktif lagi dalam <yellow>{time}</yellow>"
  dead: "<red>● HANGUS (kamu mati)</red> <gray>— aktif lagi dalam <yellow>{time}</yellow>"
  good-line: "  <green>✔ {effect}"
  risk-line: "  <red>✘ {effect}"
  next: "<gray>Naik <green>{levels}</green> level lagi untuk pengali <gold>x{multiplier}</gold>!"
  help-hint: "<dark_gray>Ketik /xpr help untuk semua perintah."
  part:
    on-forever: "<gray>Partisipasi: <green>IKUT</green> <dark_gray>(permanen)</dark_gray>"
    off-forever: "<gray>Partisipasi: <red>TIDAK IKUT</red> <dark_gray>(permanen) — ketik</dark_gray> <yellow>/xpr join</yellow>"
    on-time: "<gray>Partisipasi: <green>IKUT sementara</green> <dark_gray>— berhenti otomatis dalam</dark_gray> <yellow>{time}</yellow>"
    off-time: "<gray>Partisipasi: <red>LIBUR sementara</red> <dark_gray>— ikut lagi otomatis dalam</dark_gray> <yellow>{time}</yellow>"
    on-rounds: "<gray>Partisipasi: <green>IKUT sementara</green> <dark_gray>— sisa</dark_gray> <yellow>{rounds} round</yellow>"
    on-rounds-last: "<gray>Partisipasi: <green>IKUT sementara</green> <dark_gray>— berhenti di putaran berikutnya</dark_gray>"
    off-rounds: "<gray>Partisipasi: <red>LIBUR sementara</red> <dark_gray>— lewati</dark_gray> <yellow>{rounds} round</yellow> <dark_gray>lagi</dark_gray>"
    off-rounds-last: "<gray>Partisipasi: <red>LIBUR sementara</red> <dark_gray>— ikut lagi di putaran berikutnya</dark_gray>"

# ---------- /xpr preview ----------
preview:
  header: "<gradient:#ffd700:#ff8c00><bold>━━━ PRATINJAU PENGALI ━━━</bold></gradient>"
  line: "<gray>Level <green>{level}</green> → pengali <gold>x{multiplier}</gold> <dark_gray>•</dark_gray> efek positif <green>{good}</green> <dark_gray>•</dark_gray> peluang risiko <red>{chance}%</red>"

# ---------- ATURAN MAIN (/xpr aturan) ----------
rules:
  lines:
    - "<gradient:#ffd700:#ff8c00><bold>━━━━━━ ATURAN MAIN XP ROULETTE ━━━━━━</bold></gradient>"
    - "<yellow>1.</yellow> <gray>Tiap <white>{interval}</white>, roda takdir berputar dan memberimu efek <gold>acak</gold> selama <green>{active}</green>."
    - "<yellow>2.</yellow> <gray>Efek dipilih berdasarkan <green>level XP</green>-mu <white>saat roda berputar</white>."
    - "<yellow>3.</yellow> <gray>Level <white>0-{first_end}</white> = semua efek <white>x1</white>. Tiap naik <white>{per_tier} level</white>, kekuatan efek naik: <gold>{ladder}</gold>"
    - "<yellow>4.</yellow> <gray>Makin tinggi level, makin banyak efek positif... tapi <red>risiko</red> (Poison, Weakness, Wither, dll) juga makin sering dan kuat!"
    - "<yellow>5.</yellow> <gray>Jika kamu <red>MATI</red> saat efek aktif, efek <red>hangus</red> dan tidak diberikan lagi. Sisa siklus jadi <yellow>cooldown</yellow>."
    - "<yellow>6.</yellow> <gray>Setelah efek habis ada <yellow>{cooldown}</yellow> cooldown sebelum putaran berikutnya. Waktu hanya berjalan saat kamu <white>online</white>."
    - "<yellow>7.</yellow> <gray>Susu dan totem <red>tidak bisa</red> menghapus efek Roulette. Roda takdir tidak bisa dicurangi!"
    - "<yellow>8.</yellow> <gray>Ikut itu <white>pilihan</white>! Kamu bisa ikut/keluar <white>selamanya</white>, atau <white>sementara</white> (per durasi atau per round). Lihat <yellow>/xpr help</yellow>."
    - "<gray>Perintah: <yellow>/xpr status</yellow> <dark_gray>•</dark_gray> <yellow>/xpr aturan</yellow> <dark_gray>•</dark_gray> <yellow>/xpr preview [level]</yellow>"

# ---------- PERINTAH ----------
cmd:
  usage: "{prefix} <gray>Gunakan: <yellow>/xpr [status|join|leave|aturan|preview|help]</yellow> <dark_gray>— ketik /xpr help</dark_gray>"
  usage-admin: "{prefix} <gray>Admin: <yellow>/xpr [reload|force|reset] [pemain]</yellow>"
  no-permission: "{prefix} <red>Kamu tidak punya izin untuk itu."
  players-only: "{prefix} <red>Perintah ini hanya untuk pemain."
  player-not-found: "{prefix} <red>Pemain tidak ditemukan / tidak online."
  reloaded: "{prefix} <green>Konfigurasi dan pesan berhasil dimuat ulang."
  forced: "{prefix} <green>Roda takdir dipaksa berputar untuk <gold>{player}</gold>."
  reset: "{prefix} <green>Data Roulette <gold>{player}</gold> direset."
  invalid-number: "{prefix} <red>Angka level tidak valid."
  invalid-duration: "{prefix} <red>Format tidak valid.</red> <gray>Contoh: <yellow>30m</yellow>, <yellow>2h</yellow>, <yellow>1d</yellow>, <yellow>3r</yellow> (3 round), <yellow>forever</yellow>. Maks <white>{max_days}</white> hari / <white>{max_rounds}</white> round."
  force-not-participating: "{prefix} <red>{player}</red> <gray>sedang tidak ikut Roulette, jadi tidak bisa dipaksa."

# ---------- IKUT / KELUAR (/xpr join, /xpr leave) ----------
participation:
  join-forever: "{prefix} <green>Kamu sekarang IKUT Roulette secara permanen!</green> <gray>Roda berikutnya berputar dalam <yellow>{time}</yellow>."
  join-time: "{prefix} <green>Kamu IKUT Roulette selama</green> <yellow>{duration}</yellow><green>.</green> <gray>Setelah itu kamu otomatis keluar. Roda berikutnya dalam <yellow>{time}</yellow>."
  join-rounds: "{prefix} <green>Kamu IKUT Roulette untuk</green> <yellow>{rounds} round</yellow><green>.</green> <gray>Setelah itu kamu otomatis keluar. Roda berikutnya dalam <yellow>{time}</yellow>."
  leave-forever: "{prefix} <red>Kamu keluar dari Roulette secara permanen.</red> <gray>Ketik <yellow>/xpr join</yellow> kalau berubah pikiran. Efek yang sedang aktif dicabut."
  leave-time: "{prefix} <red>Kamu libur dari Roulette selama</red> <yellow>{duration}</yellow><red>.</red> <gray>Setelah itu kamu otomatis ikut lagi. Efek yang sedang aktif dicabut."
  leave-rounds: "{prefix} <red>Kamu melewati</red> <yellow>{rounds} round</yellow> <red>Roulette.</red> <gray>Setelah itu kamu otomatis ikut lagi. Efek yang sedang aktif dicabut."
  already-permanent-on: "{prefix} <gray>Kamu memang sudah <green>ikut secara permanen</green>. Pengaturan libur sementara dibatalkan."
  already-permanent-off: "{prefix} <gray>Kamu memang sudah <red>tidak ikut secara permanen</red>. Pengaturan ikut sementara dibatalkan."
  leave-disabled: "{prefix} <red>Server ini mewajibkan semua pemain ikut Roulette.</red> <gray>Kamu tidak bisa keluar."
  auto-off: "{prefix} <yellow>Masa ikut sementaramu berakhir.</yellow> <gray>Kamu keluar dari Roulette. Ketik <green>/xpr join</green> untuk ikut lagi."
  auto-on: "{prefix} <green>Masa liburmu selesai!</green> <gray>Kamu kembali ikut Roulette. Roda berikutnya dalam <yellow>{time}</yellow>."

# ---------- BANTUAN (/xpr help) ----------
help:
  lines:
    - "<gradient:#ffd700:#ff8c00><bold>━━━━━━ BANTUAN XP ROULETTE ━━━━━━</bold></gradient>"
    - "<yellow>/xpr</yellow> <dark_gray>atau</dark_gray> <yellow>/xpr status</yellow> <dark_gray>—</dark_gray> <gray>status, efek aktif, dan sisa waktu"
    - "<yellow>/xpr aturan</yellow> <dark_gray>—</dark_gray> <gray>aturan main lengkap"
    - "<yellow>/xpr preview [level]</yellow> <dark_gray>—</dark_gray> <gray>lihat pengali di level tertentu"
    - "<green>/xpr join</green> <dark_gray>—</dark_gray> <gray>ikut Roulette <white>selamanya</white>"
    - "<green>/xpr join [durasi|round]</green> <dark_gray>—</dark_gray> <gray>ikut <white>sementara</white>, lalu otomatis keluar"
    - "<red>/xpr leave</red> <dark_gray>—</dark_gray> <gray>keluar dari Roulette <white>selamanya</white>"
    - "<red>/xpr leave [durasi|round]</red> <dark_gray>—</dark_gray> <gray>libur <white>sementara</white>, lalu otomatis ikut lagi"
    - "<gold>Format:</gold> <yellow>30m</yellow> <gray>(menit)</gray> <yellow>2h</yellow> <gray>(jam)</gray> <yellow>1d</yellow> <gray>(hari)</gray> <yellow>3r</yellow> <gray>(3 round)</gray> <yellow>forever</yellow> <gray>(selamanya)</gray>"
    - "<gold>Contoh:</gold> <yellow>/xpr join 2h</yellow> <dark_gray>•</dark_gray> <yellow>/xpr join 5 round</yellow> <dark_gray>•</dark_gray> <yellow>/xpr leave 1d</yellow> <dark_gray>•</dark_gray> <yellow>/xpr leave forever</yellow>"
    - "<gray>Maksimal <white>{max_days}</white> hari atau <white>{max_rounds}</white> round. Durasi waktu dihitung waktu nyata, <white>1 round</white> = 1 putaran roda (hanya berjalan saat online)."
    - "<gray>Libur tidak menghapus cooldown: roda tetap berputar di jadwalnya, jadi tidak bisa dipakai untuk curang."
  admin-lines:
    - "<dark_gray>— Admin —"
    - "<yellow>/xpr reload</yellow> <dark_gray>—</dark_gray> <gray>muat ulang config.yml & messages.yml"
    - "<yellow>/xpr force [pemain]</yellow> <dark_gray>—</dark_gray> <gray>paksa roda berputar sekarang (untuk tes)"
    - "<yellow>/xpr reset [pemain]</yellow> <dark_gray>—</dark_gray> <gray>reset data ke pengaturan awal"
